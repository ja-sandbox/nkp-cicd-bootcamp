#cloud-config
# NKP CI/CD bootcamp workstation. Paste unchanged into Guest Customization > Cloud-init (Linux)
# when you deploy a VM from _TEMPLATE_UBUNTU2404. It installs the lab tools from a fixed commit
# of ja-sandbox/nkp-cicd-bootcamp; progress: /var/log/bootcamp-setup.log
users: []
runcmd:
  - [sh, -c, "make-ssl-cert generate-default-snakeoil --force-overwrite && systemctl restart xrdp"]
  - [sh, -c, "git clone -q https://github.com/ja-sandbox/nkp-cicd-bootcamp /opt/nkp-cicd-bootcamp && git -C /opt/nkp-cicd-bootcamp checkout -q 91a47fb2690bd23fc70f5dc0388b63c081cd3eee && /opt/nkp-cicd-bootcamp/setup-workstation.sh > /var/log/bootcamp-setup.log 2>&1"]
